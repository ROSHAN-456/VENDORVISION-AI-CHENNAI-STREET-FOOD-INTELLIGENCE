<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VendorVision AI — Chennai Street Food Intelligence</title>
  <meta name="description"
    content="Real-time crowd predictions and demand forecasting for Chennai street-food stalls. Find the shortest wait or get restock alerts as a vendor." />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FBF5E9',
            paper: '#FFFDF8',
            ink: '#1B2A24',
            muted: '#5E6B64',
            leaf: '#1F5A4A',
            saffron: '#E8A317',
            chili: '#C8432B',
            curry: '#DCEBDD',
            line: '#E8DEC9',
            crowdLow: '#2E9E6B',
            crowdMedium: '#E8A317',
            crowdHigh: '#C8432B',
            brand: {
              50: '#f2f8f6',
              100: '#DCEBDD',
              200: '#a3c2b8',
              300: '#75a394',
              400: '#478570',
              500: '#1F5A4A',
              600: '#18483b',
              700: '#12362c',
              800: '#1B2A24',
              900: '#06120f'
            },
            accent: '#E8A317'
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['Fraunces', 'serif']
          },
          boxShadow: {
            soft: '0 10px 30px rgba(27,42,36,.08)'
          },
          animation: {
            fadeUp: 'fadeUp 0.3s ease-out forwards',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: 0, transform: 'translateY(15px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --color-cream: #FBF5E9;
      --color-paper: #FFFDF8;
      --color-ink: #1B2A24;
      --color-muted: #5E6B64;
      --color-leaf: #1F5A4A;
      --color-saffron: #E8A317;
      --color-chili: #C8432B;
      --color-curry: #DCEBDD;
      --color-line: #E8DEC9;
      --color-crowdLow: #2E9E6B;
      --color-crowdMedium: #E8A317;
      --color-crowdHigh: #C8432B;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    #root {
      height: 100%;
      background-color: var(--color-cream);
      color: var(--color-ink);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      line-height: 1.6;
    }
    
    @media (prefers-reduced-motion: reduce) {
      *,
      ::before,
      ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
